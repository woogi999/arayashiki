[package]
name = "arayashiki"
version = "1.0.4"
description = "Jujutsu Shenanigans' Skill Builder as a desktop app, with a simulator."
edition = "2021"
publish = false

# The setup (setup/) shares this lock file and target folder; `tauri build`
# and `cargo build` here build only the app.
[workspace]
members = ["setup"]

[lib]
name = "arayashiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
flate2 = "1"
lz4_flex = "0.11"
regex = "1"
keyring = { version = "3", features = ["windows-native"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
